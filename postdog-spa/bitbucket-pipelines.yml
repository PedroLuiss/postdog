image: atlassian/default-image:3

pipelines:
  branches:
    develop:
      - step:
          name: 'Deploy to Development'
          script:
            - ssh root@135.181.199.25 "export PATH=/root/.nvm/versions/node/v22.15.0/bin:$PATH &&  cd /var/www/projects/postdog/postdog-spa && git pull && npm install && npm run build && pm2 restart spa-postdog"
    main:  
      - step:
          name: 'Deploy build to Hostinger (FTP)'
          script:
            - apt-get update && apt-get install -y lftp
            - npm install
            - echo "REACT_APP_WEBAPP_BASE_URL=https://app.mypostdog.com" > .env.production
            - CI=false npm run build
            - lftp -e "set ssl:verify-certificate no; mirror -R --delete --verbose build/ ./; quit" -u u707384497.mypostdog.com,a8#CV=N1OqwU@A!J ftp://ftp.mypostdog.com
